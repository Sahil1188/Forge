version: 2
updates:
  # Minor and patch updates arrive weekly, grouped into one pull request. Major versions (NestJS,
  # ESLint…) change APIs together across several packages, so they are upgraded by hand as a set.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dependencies:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
